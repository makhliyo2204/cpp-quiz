<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест-справочник C++</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#46178f; --bg2:#25076b;
  --red:#e21b3c; --blue:#1368ce; --yellow:#d89e00; --green:#26890c;
  --ink:#1f1f1f; --white:#fff; --muted:#6b6b7b;
  --ok:#66bf39; --bad:#f35;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Montserrat,system-ui,sans-serif;color:var(--white);
  background:radial-gradient(circle at 20% 10%,#5a2bb0 0,var(--bg1) 35%,var(--bg2) 100%);
  min-height:100vh;overflow-x:hidden;
}
.bgshapes{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgshapes span{position:absolute;opacity:.07;background:#fff}
.bgshapes .s1{width:340px;height:340px;border-radius:50%;left:-90px;top:-80px}
.bgshapes .s2{width:260px;height:260px;right:-60px;bottom:-40px;transform:rotate(25deg)}
.bgshapes .s3{width:0;height:0;background:none;border-left:140px solid transparent;border-right:140px solid transparent;border-bottom:240px solid #fff;right:12%;top:8%}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* ---------- start ---------- */
.logo{font-weight:900;font-size:clamp(42px,8vw,84px);letter-spacing:-2px;text-align:center;margin-top:3vh;line-height:1}
.logo b{color:#ffd23f}
.subtitle{text-align:center;font-weight:700;opacity:.85;margin:10px 0 26px;font-size:18px}
.card{background:#fff;color:var(--ink);border-radius:14px;padding:22px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.start-card{max-width:620px;width:100%;margin:0 auto}
label.lbl{display:block;font-weight:800;margin:14px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:#46178f}
input[type=text]{width:100%;font:inherit;font-weight:700;font-size:20px;padding:14px 16px;border:3px solid #ddd;border-radius:8px;text-align:center;outline:none}
input[type=text]:focus{border-color:var(--bg1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid #e3dcf2;background:#f6f2fd;color:#46178f;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;user-select:none;transition:.15s}
.chip.on{background:#46178f;border-color:#46178f;color:#fff}
.chip:hover{transform:translateY(-1px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:8px;padding:14px 22px;cursor:pointer;color:#fff;background:#333;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.big{width:100%;font-size:22px;padding:16px;margin-top:20px;background:#1f1f1f}
.btn.purple{background:var(--bg1)}
.btn.light{background:#fff;color:#46178f}
.btn.ghost{background:rgba(255,255,255,.15);box-shadow:none}
.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
.hint{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}

/* ---------- countdown ---------- */
#countdown{align-items:center;justify-content:center}
.cd-num{font-size:160px;font-weight:900;animation:zoom 1s ease infinite}
@keyframes zoom{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
.cd-title{font-size:28px;font-weight:800;opacity:.9}

/* ---------- question ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-weight:800}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-size:15px}
.qbox{background:#fff;color:var(--ink);border-radius:10px;padding:18px 22px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.qtopic{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#46178f;margin-bottom:6px}
.qtext{font-size:clamp(19px,2.6vw,28px);font-weight:800;line-height:1.3}
.code{font-family:"JetBrains Mono",monospace;background:#1e1b2e;color:#e7e3ff;border-radius:8px;padding:14px 16px;margin:14px auto 0;text-align:left;font-size:clamp(13px,1.6vw,16px);white-space:pre;overflow-x:auto;max-width:640px;line-height:1.55}
.middle{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:16px 0}
.timer{width:86px;height:86px;border-radius:50%;background:var(--bg1);border:5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;flex-shrink:0;transition:background .3s}
.timer.warn{background:var(--red);animation:pulse .5s ease infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:#ffd23f;width:100%;transition:width .1s linear}
.answered{min-width:86px;text-align:center;font-weight:800}
.answered b{display:block;font-size:30px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:240px}
.ans{position:relative;border:0;border-radius:8px;color:#fff;font:inherit;font-weight:800;font-size:clamp(16px,2vw,22px);text-align:left;padding:18px 18px 18px 74px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);display:flex;align-items:center;min-height:90px;transition:transform .1s,opacity .25s,filter .25s}
.ans:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px)}
.ans:active:not(:disabled){transform:translateY(3px)}
.ans svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:40px;height:40px}
.ans .k{position:absolute;right:12px;top:8px;font-size:12px;opacity:.6}
.ans code{font-family:"JetBrains Mono",monospace;background:rgba(0,0,0,.2);padding:2px 6px;border-radius:4px}
.a0{background:var(--red)}.a1{background:var(--blue)}.a2{background:var(--yellow)}.a3{background:var(--green)}
.ans.dim{opacity:.3;filter:grayscale(.4)}
.ans.right{outline:5px solid #fff;outline-offset:-5px}
.ans.right::after{content:"✔";position:absolute;right:16px;font-size:30px}
.ans.picked.wrong::after{content:"✖";position:absolute;right:16px;font-size:30px}

/* ---------- feedback ---------- */
#feedback{align-items:center;justify-content:center;text-align:center}
#feedback.okbg{background:transparent}
.fb-title{font-size:clamp(34px,6vw,56px);font-weight:900}
.fb-icon{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:64px;margin:16px auto;border:6px solid #fff}
.fb-icon.ok{background:var(--ok)}.fb-icon.bad{background:var(--bad)}
.fb-points{font-size:26px;font-weight:900;background:rgba(0,0,0,.3);display:inline-block;padding:10px 22px;border-radius:6px;margin:6px 0}
.fb-streak{font-weight:800;margin:8px 0 18px;font-size:18px}
.ref{background:#fff;color:var(--ink);border-radius:12px;padding:18px 22px;max-width:760px;width:100%;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.ref h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#46178f;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ref p{font-size:16px;line-height:1.5;font-weight:500}
.ref .ca{font-weight:800;margin-bottom:8px}
.ref code{font-family:"JetBrains Mono",monospace;background:#f1ecfb;color:#46178f;padding:1px 5px;border-radius:4px;font-size:.92em}
.ref .code{margin-top:10px;max-width:none}
.fb-actions{margin-top:20px;display:flex;gap:10px;justify-content:center}

/* ---------- results ---------- */
.podium-title{text-align:center;font-size:clamp(30px,5vw,48px);font-weight:900;margin-top:10px}
.bigscore{text-align:center;margin:10px 0 4px;font-size:clamp(54px,10vw,96px);font-weight:900;color:#ffd23f;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stat{background:rgba(255,255,255,.14);border-radius:10px;padding:14px;text-align:center}
.stat b{display:block;font-size:28px;font-weight:900}
.stat span{font-size:13px;font-weight:700;opacity:.85}
.grade{text-align:center;font-weight:800;font-size:20px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.panel{background:#fff;color:var(--ink);border-radius:12px;padding:16px 18px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.panel h3{font-size:18px;margin-bottom:10px;color:#46178f}
.lb li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;font-weight:700;list-style:none}
.lb li:nth-child(odd){background:#f5f2fb}
.lb li.me{background:#ffd23f}
.lb .pos{width:28px;display:inline-block;color:#46178f;font-weight:900}
.review{max-height:340px;overflow:auto}
.rv{border-left:5px solid var(--ok);padding:6px 10px;margin-bottom:8px;background:#f8f8fb;border-radius:4px;font-size:14px}
.rv.bad{border-color:var(--bad)}
.rv b{display:block}
.rv small{color:var(--muted);font-weight:600}
.tbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px;font-weight:700}
.tbar .tn{width:150px;flex-shrink:0}
.tbar .tt{flex:1;height:10px;background:#eee;border-radius:9px;overflow:hidden}
.tbar .tt i{display:block;height:100%;background:var(--green)}

/* ---------- reference ---------- */
.ref-head{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ref-head input{flex:1;min-width:200px;font-size:16px;text-align:left}
.ref-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.rcard{background:#fff;color:var(--ink);border-radius:10px;padding:14px 16px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.rcard .t{font-size:11px;font-weight:800;color:#46178f;text-transform:uppercase;letter-spacing:1px}
.rcard h5{font-size:16px;margin:4px 0 6px}
.rcard p{font-size:14px;line-height:1.45}
.rcard code{font-family:"JetBrains Mono",monospace;background:#f1ecfb;color:#46178f;padding:1px 4px;border-radius:4px;font-size:.92em}
.rcard .code{font-size:13px;margin-top:8px}
.empty{opacity:.8;text-align:center;padding:30px;font-weight:700}

.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:720px){
  .answers{grid-template-columns:1fr;min-height:0}
  .ans{min-height:64px;padding-left:64px}
  .ans svg{width:32px;height:32px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .timer{width:66px;height:66px;font-size:26px}
  .tbar .tn{width:110px}
}
</style>
</head>
<body>
<div class="bgshapes"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
<main>

<!-- START -->
<section class="screen active" id="start">
  <div class="logo">C<b>++</b> Quiz!</div>
  <div class="subtitle">Тест-справочник по языку C++</div>
  <div class="tabs">
    <button class="btn light" onclick="show('start')">🎮 Играть</button>
    <button class="btn ghost" onclick="openRef()">📘 Справочник</button>
  </div>
  <div class="card start-card">
    <label class="lbl" for="nick">Ваше имя</label>
    <input type="text" id="nick" maxlength="20" placeholder="Введите никнейм" autocomplete="off">
    <label class="lbl">Темы</label>
    <div class="chips" id="topicChips"></div>
    <label class="lbl">Количество вопросов</label>
    <div class="chips" id="countChips"></div>
    <label class="lbl">Время на вопрос</label>
    <div class="chips" id="timeChips"></div>
    <button class="btn big" id="goBtn">Начать ▶</button>
    <div class="hint">Отвечайте мышкой или клавишами 1–4. Чем быстрее правильный ответ — тем больше очков!</div>
  </div>
</section>

<!-- COUNTDOWN -->
<section class="screen" id="countdown">
  <div class="cd-title" id="cdTitle">Приготовьтесь!</div>
  <div class="cd-num" id="cdNum">3</div>
</section>

<!-- QUESTION -->
<section class="screen" id="question">
  <div class="topbar">
    <span class="pill" id="qCounter">1 / 10</span>
    <span class="pill" id="qPlayer">Игрок</span>
    <span class="pill">⭐ <span id="qScore">0</span></span>
  </div>
  <div class="qbox">
    <div class="qtopic" id="qTopic"></div>
    <div class="qtext" id="qText"></div>
    <div class="code" id="qCode" hidden></div>
  </div>
  <div class="middle">
    <div class="timer" id="timer">20</div>
    <div class="bar"><i id="timeBar"></i></div>
    <div class="answered">Серия<b id="qStreak">0🔥</b></div>
  </div>
  <div class="answers" id="answers"></div>
</section>

<!-- FEEDBACK -->
<section class="screen" id="feedback">
  <div class="fb-title" id="fbTitle">Верно!</div>
  <div class="fb-icon" id="fbIcon">✔</div>
  <div class="fb-points" id="fbPoints">+ 850</div>
  <div class="fb-streak" id="fbStreak"></div>
  <div class="ref" id="fbRef"></div>
  <div class="fb-actions">
    <button class="btn light" id="nextBtn">Далее ▶</button>
  </div>
</section>

<!-- RESULTS -->
<section class="screen" id="results">
  <div class="podium-title" id="resTitle">Итоги игры</div>
  <div class="bigscore" id="resScore">0</div>
  <div class="grade" id="resGrade"></div>
  <div class="stats" id="resStats"></div>
  <div class="two">
    <div class="panel">
      <h3>🏆 Таблица лидеров</h3>
      <ol class="lb" id="leader"></ol>
      <h3 style="margin-top:16px">📊 По темам</h3>
      <div id="byTopic"></div>
    </div>
    <div class="panel">
      <h3>📝 Разбор ответов</h3>
      <div class="review" id="review"></div>
    </div>
  </div>
  <div class="fb-actions">
    <button class="btn light" onclick="startGame()">🔁 Ещё раз</button>
    <button class="btn ghost" onclick="retryWrong()" id="retryBtn">Повторить ошибки</button>
    <button class="btn ghost" onclick="show('start')">В меню</button>
  </div>
</section>

<!-- REFERENCE -->
<section class="screen" id="reference">
  <div class="ref-head">
    <button class="btn ghost" onclick="show('start')">← Назад</button>
    <input type="text" id="refSearch" placeholder="Поиск по справочнику: указатель, vector, класс…">
  </div>
  <div class="chips" id="refChips" style="margin-bottom:14px"></div>
  <div class="ref-list" id="refList"></div>
</section>

</main>

<script>
/* ================== DATA ================== */
const TOPICS = ["Основы и типы","Операторы","Условия и циклы","Функции","Массивы и строки","Указатели и память","ООП","STL"];

// a: answers, c: correct index, e: справка (HTML allowed: <code>), ex: пример кода
const Q = [
 // Основы и типы
 {t:0,q:"Какой заголовочный файл нужен для использования cout и cin?",a:["<iostream>","<stdio>","<conio.h>","<string>"],c:0,
  h:"Подключение потоков ввода-вывода",e:"Объекты <code>std::cout</code> и <code>std::cin</code> объявлены в заголовке <code>&lt;iostream&gt;</code>. Чтобы не писать <code>std::</code>, часто добавляют <code>using namespace std;</code>.",
  ex:"#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello, C++!\" << endl;\n    return 0;\n}"},
 {t:0,q:"Чему равно значение sizeof(char)?",a:["1","2","4","Зависит от компилятора"],c:0,
  h:"Оператор sizeof",e:"По стандарту <code>sizeof(char)</code> всегда равен 1 — это единица измерения для всех остальных типов. Размеры <code>int</code>, <code>long</code> и т.д. зависят от платформы (обычно <code>int</code> = 4 байта)."},
 {t:0,q:"Какой тип хранит логическое значение true / false?",a:["bool","boolean","logic","bit"],c:0,
  h:"Логический тип bool",e:"Тип <code>bool</code> принимает значения <code>true</code> и <code>false</code>. При выводе через <code>cout</code> печатается 1 или 0; для слов используйте <code>cout &lt;&lt; boolalpha</code>.",
  ex:"bool ok = (5 > 3);   // true\ncout << ok;           // 1\ncout << boolalpha << ok; // true"},
 {t:0,q:"Какой тип будет у переменной x?",code:"auto x = 3.14;",a:["double","float","int","auto"],c:0,
  h:"Ключевое слово auto (C++11)",e:"<code>auto</code> выводит тип из инициализатора. Литерал <code>3.14</code> имеет тип <code>double</code>; для <code>float</code> нужен суффикс: <code>3.14f</code>."},
 {t:0,q:"Что произойдёт при компиляции этого кода?",code:"const int x = 5;\nx = 6;",a:["Ошибка компиляции","x станет 6","x останется 5 без ошибки","Ошибка во время выполнения"],c:0,
  h:"Константы const",e:"Переменную, объявленную с <code>const</code>, нельзя изменить после инициализации — компилятор выдаст ошибку. Константы обязательно инициализируются при объявлении."},
 {t:0,q:"Как записывается однострочный комментарий в C++?",a:["// комментарий","# комментарий","<!-- комментарий -->","-- комментарий"],c:0,
  h:"Комментарии",e:"Однострочный комментарий начинается с <code>//</code> и длится до конца строки. Многострочный заключается в <code>/* ... */</code>."},
 {t:0,q:"Чем cin >> s отличается от getline(cin, s) при чтении строки?",a:["cin >> читает до пробела, getline — всю строку","Ничем","getline читает только одно слово","cin >> читает всю строку с пробелами"],c:0,
  h:"Ввод строк",e:"<code>cin &gt;&gt; s</code> останавливается на первом пробельном символе. <code>getline(cin, s)</code> читает всю строку до <code>Enter</code>. После <code>cin &gt;&gt;</code> перед <code>getline</code> часто нужен <code>cin.ignore()</code>.",
  ex:"string name;\ngetline(cin, name); // \"Иван Петров\""},

 // Операторы
 {t:1,q:"Что выведет программа?",code:"int a = 7 / 2;\ncout << a;",a:["3","3.5","4","Ошибка"],c:0,
  h:"Целочисленное деление",e:"Если оба операнда целые, <code>/</code> выполняет целочисленное деление — дробная часть отбрасывается. Чтобы получить 3.5, нужен хотя бы один вещественный операнд: <code>7.0 / 2</code>."},
 {t:1,q:"Чему равно выражение 17 % 5?",a:["2","3","3.4","5"],c:0,
  h:"Остаток от деления %",e:"Оператор <code>%</code> возвращает остаток от целочисленного деления: 17 = 5·3 + 2. Применяется только к целым типам. Типичное использование — проверка чётности: <code>n % 2 == 0</code>."},
 {t:1,q:"Какой оператор проверяет равенство двух значений?",a:["==","=","===",":="],c:0,
  h:"Сравнение и присваивание",e:"<code>==</code> — сравнение, <code>=</code> — присваивание. Частая ошибка: <code>if (x = 5)</code> присваивает 5 и всегда истинно. Оператора <code>===</code> в C++ нет."},
 {t:1,q:"Что выведет программа?",code:"int x = 5;\nint y = x++;\ncout << x << \" \" << y;",a:["6 5","5 6","6 6","5 5"],c:0,
  h:"Инкремент: префиксный и постфиксный",e:"Постфиксный <code>x++</code> возвращает старое значение, а затем увеличивает переменную: y = 5, x = 6. Префиксный <code>++x</code> сначала увеличивает, потом возвращает новое значение."},
 {t:1,q:"Каков результат логического выражения?",code:"bool r = (3 > 2) && !(5 == 5);",a:["false","true","Ошибка компиляции","1 и 0"],c:0,
  h:"Логические операторы && || !",e:"<code>&amp;&amp;</code> — И, <code>||</code> — ИЛИ, <code>!</code> — НЕ. Здесь <code>true &amp;&amp; !true</code> = <code>true &amp;&amp; false</code> = <code>false</code>."},

const SHAPES = [

const cfg = {topics:new Set(TOPICS.map((_,i)=>i)), count:15, time:20};
let game = null, timerId = null;
const $ = id => document.getElementById(id);

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtAns(s){ // monospace for code-like answers
  return /[<>(){};\[\]=:+%&!~'\\]/.test(s) ? '<code>'+esc(s)+'</code>' : esc(s);
}
function store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){return null}}

/* ================== SETUP UI ================== */
function chipGroup(el, items, isOn, onClick){
  el.innerHTML='';
  items.forEach((it,i)=>{
    const b=document.createElement('button');
    b.className='chip'+(isOn(it,i)?' on':'');
    b.textContent=it.label??it;
    b.onclick=()=>{onClick(it,i);chipGroup(el,items,isOn,onClick)};
    el.appendChild(b);
  });
}
function renderSetup(){
  const all={label:'Все темы'};
  chipGroup($('topicChips'),[all,...TOPICS],
    (it,i)=> i===0 ? cfg.topics.size===TOPICS.length : cfg.topics.has(i-1),
    (it,i)=>{
      if(i===0){ cfg.topics = cfg.topics.size===TOPICS.length ? new Set() : new Set(TOPICS.map((_,k)=>k)); }
      else { cfg.topics.has(i-1)?cfg.topics.delete(i-1):cfg.topics.add(i-1); }
    });
  const counts=[{label:'10',v:10},{label:'15',v:15},{label:'25',v:25},{label:'Все ('+Q.length+')',v:999}];
  chipGroup($('countChips'),counts,it=>cfg.count===it.v,it=>cfg.count=it.v);
  const times=[{label:'10 сек',v:10},{label:'20 сек',v:20},{label:'30 сек',v:30},{label:'60 сек',v:60}];
  chipGroup($('timeChips'),times,it=>cfg.time===it.v,it=>cfg.time=it.v);
}
$('nick').value = store('cppquiz_nick') || '';
$('goBtn').onclick = ()=>{
  if(!$('nick').value.trim()){ $('nick').focus(); $('nick').style.borderColor='var(--red)'; return; }
  if(cfg.topics.size===0){ alertBox('Выберите хотя бы одну тему'); return; }
  store('cppquiz_nick',$('nick').value.trim());
  startGame();
};
function alertBox(msg){ const h=document.querySelector('#start .hint'); h.textContent=msg; h.style.color='var(--red)'; setTimeout(()=>{h.textContent='Отвечайте мышкой или клавишами 1–4. Чем быстрее правильный ответ — тем больше очков!';h.style.color=''},2500); }

/* ================== GAME ================== */
function buildSet(pool){
  return shuffle(pool.slice()).map(q=>{
    const order=shuffle([0,1,2,3]);
    return {...q, A:order.map(i=>q.a[i]), C:order.indexOf(q.c)};
  });
}
function startGame(pool){
  const base = pool || Q.filter(q=>cfg.topics.has(q.t));
  let set = buildSet(base);
  if(!pool) set = set.slice(0, Math.min(cfg.count, set.length));
  game = {name:($('nick').value.trim()||'Игрок'), qs:set, i:0, score:0, streak:0, best:0, log:[], retry:!!pool};
  countdown(()=>ask());
}
function retryWrong(){
  const wrong = game.log.filter(l=>!l.ok).map(l=>l.q);
  if(!wrong.length) return;
  startGame(wrong.map(w=>Q.find(q=>q.q===w.q && q.code===w.code)));
}
function countdown(done){
  show('countdown'); let n=3; $('cdNum').textContent=n;
  $('cdTitle').textContent = game.retry ? 'Работа над ошибками!' : 'Приготовьтесь, '+game.name+'!';
  const t=setInterval(()=>{ n--; if(n<=0){clearInterval(t);done();} else { const el=$('cdNum'); el.textContent=n; el.style.animation='none'; el.offsetHeight; el.style.animation=''; } },900);
}
function ask(){
  const q = game.qs[game.i];
  $('qCounter').textContent = (game.i+1)+' / '+game.qs.length;
  $('qPlayer').textContent = game.name;
  $('qScore').textContent = game.score;
  $('qStreak').textContent = game.streak+'🔥';
  $('qTopic').textContent = TOPICS[q.t];
  $('qText').textContent = q.q;
  if(q.code){ $('qCode').hidden=false; $('qCode').textContent=q.code; } else $('qCode').hidden=true;
  const box=$('answers'); box.innerHTML='';
  q.A.forEach((txt,k)=>{
    const b=document.createElement('button');
    b.className='ans a'+k;
    b.innerHTML=SHAPES[k]+'<span>'+fmtAns(txt)+'</span><span class="k">'+(k+1)+'</span>';
    b.onclick=()=>answer(k);
    box.appendChild(b);
  });
  show('question');
  game.t0 = performance.now(); game.locked=false;
  const total=cfg.time*1000;
  clearInterval(timerId);
  timerId=setInterval(()=>{
    const left=Math.max(0,total-(performance.now()-game.t0));
    $('timer').textContent=Math.ceil(left/1000);
    $('timer').classList.toggle('warn', left<=5000);
    $('timeBar').style.width=(left/total*100)+'%';
    if(left<=0) answer(-1);
  },100);
}
function answer(k){
  if(game.locked) return; game.locked=true; clearInterval(timerId);
  const q=game.qs[game.i];
  const elapsed=Math.min(cfg.time*1000, performance.now()-game.t0);
  const ok = k===q.C;
  let pts=0, bonus=0;
  if(ok){
    pts = Math.round(1000*(1 - (elapsed/(cfg.time*1000))/2)); // 500..1000 как в Kahoot
    game.streak++; game.best=Math.max(game.best,game.streak);
    if(game.streak>=2) bonus=Math.min(500,(game.streak-1)*100);
  } else game.streak=0;
  game.score += pts+bonus;
  game.log.push({q, picked:k, ok, pts:pts+bonus, time:elapsed/1000});
  // подсветка
  document.querySelectorAll('.ans').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.C) b.classList.add('right'); else b.classList.add('dim');
    if(i===k){ b.classList.add('picked'); if(!ok){b.classList.add('wrong');b.classList.remove('dim')} }
  });
  setTimeout(()=>feedback(q,k,ok,pts,bonus), 900);
}
function feedback(q,k,ok,pts,bonus){
  $('fbTitle').textContent = ok ? ['Верно!','Отлично!','Супер!','Так держать!'][Math.floor(Math.random()*4)] : (k===-1?'Время вышло!':'Неверно');
  const ic=$('fbIcon'); ic.className='fb-icon '+(ok?'ok':'bad'); ic.textContent=ok?'✔':'✖';
  $('fbPoints').textContent = ok ? '+ '+(pts+bonus) : '+ 0';
  $('fbStreak').textContent = ok ? (game.streak>=2?'🔥 Серия ответов: '+game.streak+'  (бонус +'+bonus+')':'Серия ответов: 1') : 'Серия прервана — следующий вопрос ваш!';
  $('fbRef').innerHTML =
    '<h4>📘 Справка: '+esc(q.h)+'</h4>'+
    '<p class="ca">Правильный ответ: '+fmtAns(q.A[q.C])+'</p>'+
    '<p>'+q.e+'</p>'+(q.ex?'<div class="code">'+esc(q.ex)+'</div>':'');
  $('nextBtn').textContent = game.i+1<game.qs.length ? 'Далее ▶' : 'Результаты 🏁';
  show('feedback');
  if(ok && game.streak>=3) confetti(40);
}
$('nextBtn').onclick=()=>{ game.i++; if(game.i<game.qs.length) ask(); else results(); };

/* ================== RESULTS ================== */
function results(){
  const n=game.qs.length, right=game.log.filter(l=>l.ok).length, pct=Math.round(right/n*100);
  const avg=(game.log.reduce((s,l)=>s+l.time,0)/n).toFixed(1);
  $('resTitle').textContent = game.name+', ваш результат';
  $('resScore').textContent = game.score.toLocaleString('ru-RU');
  let grade = pct>=90?'Оценка «5» — превосходно! 🏆':pct>=75?'Оценка «4» — хорошо! 👍':pct>=50?'Оценка «3» — неплохо, повторите справочник 📘':'Оценка «2» — стоит повторить материал 💪';
  $('resGrade').textContent = grade;
  $('resStats').innerHTML = [
    [right+' / '+n,'правильных'],[pct+'%','точность'],[game.best+'🔥','лучшая серия'],[avg+' с','среднее время']
  ].map(s=>'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>').join('');

  // лидеры (локально)
  let lb = store('cppquiz_lb') || [];
  const entry={n:game.name,s:game.score,p:pct,d:Date.now()};
  if(!game.retry){ lb.push(entry); lb.sort((a,b)=>b.s-a.s); lb=lb.slice(0,10); store('cppquiz_lb',lb); }
  const list = lb.length?lb:[entry];
  $('leader').innerHTML = list.map((e,i)=>'<li class="'+(e.d===entry.d?'me':'')+'"><span><span class="pos">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.')+'</span>'+esc(e.n)+'</span><span>'+e.s.toLocaleString('ru-RU')+' · '+e.p+'%</span></li>').join('');

  // по темам
  const by={}; game.log.forEach(l=>{const t=l.q.t; by[t]=by[t]||{r:0,n:0}; by[t].n++; if(l.ok)by[t].r++;});
  $('byTopic').innerHTML = Object.keys(by).map(t=>{const p=Math.round(by[t].r/by[t].n*100);
    return '<div class="tbar"><span class="tn">'+TOPICS[t]+'</span><span class="tt"><i style="width:'+p+'%;background:'+(p>=75?'var(--green)':p>=50?'var(--yellow)':'var(--red)')+'"></i></span><span>'+by[t].r+'/'+by[t].n+'</span></div>'}).join('');

  // разбор
  $('review').innerHTML = game.log.map((l,i)=>'<div class="rv '+(l.ok?'':'bad')+'"><b>'+(i+1)+'. '+esc(l.q.q)+'</b>'+
    (l.ok?'<small>✔ '+esc(l.q.A[l.q.C])+' · +'+l.pts+'</small>':
     '<small>✖ Ваш ответ: '+(l.picked===-1?'нет ответа':esc(l.q.A[l.picked]))+'<br>✔ Верно: '+esc(l.q.A[l.q.C])+'</small>')+'</div>').join('');
  $('retryBtn').style.display = right<n ? '' : 'none';
  show('results');
  if(pct>=75) confetti(120);
}

/* ================== REFERENCE ================== */
let refTopic=-1;
function openRef(){ show('reference'); renderRefChips(); renderRef(); }
function renderRefChips(){
  chipGroup($('refChips'),['Все',...TOPICS],(it,i)=>refTopic===i-1,(it,i)=>{refTopic=i-1;renderRef()});
}
function renderRef(){
  const s=$('refSearch').value.trim().toLowerCase();
  const seen=new Set();
  const items=Q.filter(q=>(refTopic<0||q.t===refTopic)).filter(q=>{
    const hay=(q.h+' '+q.e+' '+q.q+' '+(q.ex||'')+' '+(q.code||'')).toLowerCase();
    return !s||hay.includes(s);
  }).filter(q=>{ if(seen.has(q.h)) return false; seen.add(q.h); return true; });
  $('refList').innerHTML = items.length ? items.map(q=>'<div class="rcard"><div class="t">'+TOPICS[q.t]+'</div><h5>'+esc(q.h)+'</h5><p>'+q.e+'</p>'+
    (q.ex||q.code?'<div class="code">'+esc(q.ex||q.code)+'</div>':'')+'</div>').join('')
    : '<div class="empty">Ничего не найдено</div>';
}
$('refSearch').addEventListener('input',renderRef);

/* ================== MISC ================== */
document.addEventListener('keydown',e=>{
  if($('question').classList.contains('active') && ['1','2','3','4'].includes(e.key)) answer(+e.key-1);
  else if($('feedback').classList.contains('active') && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); $('nextBtn').click(); }
  else if($('start').classList.contains('active') && e.key==='Enter') $('goBtn').click();
});
function confetti(n){
  const cols=['#e21b3c','#1368ce','#d89e00','#26890c','#ffd23f','#fff'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*2)+'s'; c.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),5000);
  }
}
renderSetup();
</script>
